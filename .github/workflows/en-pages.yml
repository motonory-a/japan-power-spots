# 英語版のスポットページを作り直す（v3.16）
# ・英語名と英語版Wikipediaの要約を取得し（scripts/fetch_en_wiki.py）、en/spots/ のページ・data/en-labels.js・sitemap.xml を作って main に反映する
# ・データや訳を変えて main に push したとき、毎週月曜、または Actions 画面から手動実行したときに動く
# ・このワークフローが push した変更では、もう一度は動かない（GITHUB_TOKEN による push のため）
name: en-pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * 0'   # 毎週月曜 3:17（日本時間）
  push:
    branches: [main]
    paths:
      - 'data/spots-osm.js'
      - 'data/curated-info.js'
      - 'data/known-benefits.js'
      - 'data/model-courses.js'
      - 'en/i18n-en.js'
      - 'en/pool-en.js'
      - 'scripts/build_en_pages.js'
      - 'scripts/fetch_en_wiki.py'

permissions:
  contents: write

concurrency:
  group: en-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 英語版で扱うスポットの一覧
        run: node scripts/build_en_pages.js --pool

      - name: 英語名・Wikipediaの要約を取得
        run: python3 scripts/fetch_en_wiki.py

      - name: 英語のスポットページを作る
        run: node scripts/build_en_pages.js

      - name: main に反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/en-pool.json data/en-wiki.json data/en-labels.js en/spots sitemap.xml
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -qm "英語版のスポットページを更新（自動）"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
