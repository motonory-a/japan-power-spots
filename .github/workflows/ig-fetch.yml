name: Fetch Instagram images
on:
  push:
    branches: [main]
    paths: ['ig/fetch.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ig_fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ig/src
          git diff --cached --quiet || git commit -m "Fetch Instagram images"
          git pull --rebase -q && git push
